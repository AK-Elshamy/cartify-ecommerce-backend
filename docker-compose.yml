services:
  db:
    image: postgres:17-alpine
    container_name: cartify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartify_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cartify-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cartify_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APPLICATION_SECURITY_JWT_SECRET_KEY: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APPLICATION_PAYMENT_WEBHOOK_SECRET: cartify-webhook-secret-2026
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
