# ===============================
# Application
# ===============================
spring.application.name=cartify
server.port=8080
# ===============================
# Database - MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cartify_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG
app.upload.dir=uploads
app.upload.max-file-size=5MB
# JWT Configuration (Secret must be at least 256-bit / 32+ characters in Hex or Base64)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
spring.data.web.pageable.serialization-mode=via-dto
application.payment.webhook-secret=cartify-webhook-secret-2026